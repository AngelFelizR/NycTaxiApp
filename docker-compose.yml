# Development compose (dev container + local PostgreSQL).
# This is NOT the deployment compose: phase 7 writes the canonical one with
# the three networks and resource limits of section 1.0/1.1 of the master doc.
services:
  nyc-taxi-app:
    build:
      context: .
    image: angelfelizr/nyc-taxi-app:4.5.2
    container_name: nyc-taxi-app
    ports:
      # Loopback only: this is root SSH into a container that mounts the whole
      # repository, and binding 0.0.0.0 would expose it on every network the
      # host joins.
      - "127.0.0.1:2222:22"
    # mori mmaps the fitted policy into /dev/shm (119 MB after quosure
    # sanitising); Docker's default 64 MB would fail with ENOSPC.
    shm_size: "2g"
    volumes:
      - .:/root/NycTaxiApp
      # Models are never baked into the image (section 4.5); read-only mount.
      - ${MODELS_DIR:?Set MODELS_DIR in .env}:/models:ro
      # Trip dataset and zone shapes (section 15); read-only, same rule.
      - ${DATA_DIR:?Set DATA_DIR in .env}:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nyctaxi_dev_net

  postgres:
    image: postgres:16-alpine
    container_name: nyc-taxi-postgres
    env_file:
      - .env
    ports:
      # Dev convenience only (psql from the host). Section 9.3 forbids
      # publishing Postgres in production; the deployment compose won't.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyctaxi} -d ${POSTGRES_DB:-nyctaxi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nyctaxi_dev_net

  redis:
    image: redis:7-alpine
    container_name: nyc-taxi-redis
    # Sensitivity cache (1h TTL); phase 3 adds rate limits and counters.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # Dev convenience only (redis-cli from the host); production compose
      # (phase 7) keeps Redis on the private data network.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nyctaxi_dev_net

volumes:
  pgdata:

networks:
  nyctaxi_dev_net:
