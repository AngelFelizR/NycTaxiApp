# CI/CD (master doc 8.6, §14 phase 7).
#
# Tests and images are filtered per service so that touching `app/` never
# rebuilds the API image -- the monorepo boundary of docs/REPO_DECISION.md,
# expressed as `paths:` (8.6).
#
# Jobs
#   test-contract   spectral lint of both OpenAPI documents (10 s, always)
#   test-api        testthat with a real Postgres and Redis service container
#   test-shiny      the UI suite, including the shinytest2 flow in Chromium
#   test-share      the public share service suite
#   test-integration  API<->UI tests; skipped until integration/ has content
#   build-*         multi-arch image to GHCR (latest + :sha)
#   deploy          SSH to the VM: fetch+verify assets, pull, up, smoke test
#
# Assumptions worth knowing before the first run:
#   - Builds run on ubuntu-24.04-arm (free for public repos) because the VM is
#     ARM: building under QEMU makes a Nix closure unbearably slow.
#   - Tests run on ubuntu-latest (x86_64); nothing there is architecture
#     sensitive, and the rstats-on-nix binary cache has both.
#   - The API suite passes with no models and no dataset mounted (472 assertions
#     and one guarded skip), so CI never downloads the 534 MB release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Test-only values: .env is gitignored and absent from the checkout, so
  # whatever the jobs export is what the suites read.
  API_INTERNAL_KEY: ci-internal-key-not-a-secret
  IP_HASH_SALT: ci-ip-hash-salt
  POSTGRES_HOST: localhost
  REDIS_HOST: localhost

jobs:
  # ---------------------------------------------------------------------
  # Which services changed? Everything else keys off these outputs.
  # ---------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      share: ${{ steps.filter.outputs.share }}
      nix: ${{ steps.filter.outputs.nix }}
      integration: ${{ steps.filter.outputs.integration }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contract:
              - 'contract/**'
            api:
              - 'api/**'
            app:
              - 'app/**'
              - 'shared/**'
            share:
              - 'share/**'
              - 'shared/**'
            # A pin or a package-set change rebuilds every shell, so every
            # suite has to re-run.
            nix:
              - 'nix/**'
              - 'default.nix'
            # Anything that goes into an image.
            images:
              - 'api/**'
              - 'app/**'
              - 'share/**'
              - 'shared/**'
              - 'nix/**'
              - 'Dockerfile'
              - '.dockerignore'
            integration:
              - 'integration/**'

  # ---------------------------------------------------------------------
  # test-contract: cheap and the contract is what every service reads, so it
  # runs on every change rather than being filtered away.
  # ---------------------------------------------------------------------
  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: spectral lint (0 errors is the bar)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo stoplight/spectral lint \
            contract/openapi.yaml contract/share.openapi.yaml \
            --ruleset contract/.spectral.yaml

  # ---------------------------------------------------------------------
  # test-api: real Postgres and real Redis, exactly like the dev container.
  # Postgres comes from a service container, not testcontainers (ADR 0001).
  # ---------------------------------------------------------------------
  test-api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.nix == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nyctaxi
          POSTGRES_PASSWORD: nyctaxi
          POSTGRES_DB: nyctaxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyctaxi -d nyctaxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    # No .env exists in a fresh checkout (it is gitignored), so the values the
    # compose gives the containers have to be given here instead. Without them
    # the suite would connect to a host called "postgres" and every endpoint
    # would 403 on an empty API_INTERNAL_KEY.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nyctaxi
      POSTGRES_USER: nyctaxi
      POSTGRES_PASSWORD: nyctaxi
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      API_INTERNAL_KEY: ci-internal-key
      IP_HASH_SALT: ci-ip-hash-salt
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=
      - name: API tests
        working-directory: api
        run: |
          set -o pipefail
          nix-shell default.dev.nix --run "Rscript tests/testthat.R" 2>&1 \
            | tee "$RUNNER_TEMP/api.log"
      - name: annotate failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/api.log" "API tests"

  # ---------------------------------------------------------------------
  # test-shiny: app/default.dev.nix carries chromium through test-tools.nix.
  # The flow test refuses to run otherwise and skips instead of failing, so
  # the shell is part of the assertion, not an implementation detail.
  # ---------------------------------------------------------------------
  test-shiny:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.nix == 'true'
    # The flow test drives the real Setup screen, and Setup builds its zone
    # choices from ZonesShapes.qs2 (1 MB). A runner has no data volume, so
    # app_options() came back with no zones, the map stayed empty and the test
    # timed out waiting for #setup-validate. The parquet and the models are
    # still not downloaded: dev/mock_api.R answers every API call, which is
    # why the rest of the release (534 MB) stays out of CI.
    env:
      DATA_DIR: /tmp/nyctaxi-ci-data
    steps:
      - uses: actions/checkout@v4
      - name: zone shapes (1 MB, not the 534 MB release)
        run: |
          mkdir -p "$DATA_DIR"
          curl -fsSL -o "$DATA_DIR/ZonesShapes.qs2" \
            https://github.com/AngelFelizR/NycTaxiApp/releases/download/v0.0.1-data/ZonesShapes.qs2
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=
      - name: UI tests (unit + shinytest2 flow)
        working-directory: app
        run: |
          set -o pipefail
          nix-shell default.dev.nix --run "Rscript tests/testthat.R" 2>&1 \
            | tee "$RUNNER_TEMP/app.log"
      - name: annotate failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/app.log" "test-shiny"

  # ---------------------------------------------------------------------
  # test-share: needs Redis (the cache and routes tests skip without it) but
  # never the API -- test-routes.R boots its own stub.
  # ---------------------------------------------------------------------
  test-share:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.share == 'true' || needs.changes.outputs.nix == 'true'
    # Same reason as test-api: no .env in a fresh checkout. test-routes.R
    # sends this key to POST /render-card and the stub the test boots reads it
    # from its own environment, so the value has to exist here.
    env:
      API_INTERNAL_KEY: ci-internal-key
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=
      - name: share tests
        working-directory: share
        run: |
          set -o pipefail
          nix-shell default.dev.nix --run "Rscript tests/testthat.R" 2>&1 \
            | tee "$RUNNER_TEMP/share.log"
      - name: annotate failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/share.log" "test-share"

  # ---------------------------------------------------------------------
  # test-integration: the three descriptions of the system against each
  # other (contract <-> registered routes <-> client paths). No services: it
  # only reads files, which is why it needs no Postgres or Redis.
  # ---------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@v4
      # This job did not have this step: `nix-shell` does not exist on a
      # GitHub runner, so it failed after five seconds with "command not
      # found" rather than running a single test.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=
      - name: Run integration tests if the package exists
        run: |
          if [[ ! -f integration/DESCRIPTION ]]; then
            echo "integration/ has no DESCRIPTION yet -- nothing to run."
            exit 0
          fi
          set -o pipefail
          nix-shell default.nix -A shell --run "cd integration && Rscript tests/testthat.R" 2>&1 \
            | tee "$RUNNER_TEMP/integration.log"
      - name: annotate failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/integration.log" "test-integration"

  # ---------------------------------------------------------------------
  # Images. Native ARM: the deployment VM is ARM and a Nix closure under QEMU
  # does not fit in a job.
  # ---------------------------------------------------------------------
  build-api:
    runs-on: ubuntu-24.04-arm
    needs: [changes, test-api]
    if: >-
      needs.changes.outputs.images == 'true' && !cancelled() &&
      needs.test-api.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-api:latest
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-shiny:
    runs-on: ubuntu-24.04-arm
    needs: [changes, test-shiny]
    if: >-
      needs.changes.outputs.images == 'true' && !cancelled() &&
      needs.test-shiny.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-shiny:latest
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-shiny:${{ github.sha }}
          cache-from: type=gha,scope=shiny
          cache-to: type=gha,scope=shiny,mode=max

  build-share:
    runs-on: ubuntu-24.04-arm
    needs: [changes, test-share]
    if: >-
      needs.changes.outputs.images == 'true' && !cancelled() &&
      needs.test-share.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: share/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-share:latest
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-share:${{ github.sha }}
          cache-from: type=gha,scope=share
          cache-to: type=gha,scope=share,mode=max

  # ---------------------------------------------------------------------
  # Deploy (main only). Downtime of ~30s is accepted (8.6).
  #
  # Secrets the repository needs: VM_HOST, VM_USER, VM_SSH_KEY.
  # The VM is expected to hold the repository at ~/NycTaxiApp with .env,
  # /srv/nyctaxi/{models,data} and /backups already provisioned.
  # ---------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, build-api, build-shiny, build-share]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy and smoke test
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          # The scripts travel with the checkout, not with the images.
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/NycTaxiApp
          git pull --ff-only

          # 4.5: download and verify the release assets. fetch-assets.sh is
          # idempotent -- already-present and correct files cost one HTTP
          # request (the manifest) -- and aborts before anything restarts if
          # a checksum cannot be verified.
          MODELS_DIR=/srv/nyctaxi/models DATA_DIR=/srv/nyctaxi/data \
            ./infra/scripts/fetch-assets.sh

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "waiting for the stack to settle..."
          sleep 20

          # Smoke test of EXPOSURE (8.6): the API must not be reachable
          # through the edge, and only nginx may publish a port.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   --max-time 15 https://nyctaxiapp.angelfeliz.com/api/health || true)
          if [[ "$code" != "404" ]]; then
            echo "FAIL: /api/health answered $code, expected 404" >&2
            exit 1
          fi

          published=$(docker ps --format '{{.Ports}}' | tr ' ' '\n' | grep -oE '^[0-9]+:' | sort -u | tr -d ':')
          unexpected=$(comm -23 <(echo "$published") <(printf '443\n80\n') || true)
          if [[ -n "${unexpected// }" ]]; then
            echo "FAIL: unexpected published ports: $unexpected" >&2
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                   https://nyctaxiapp.angelfeliz.com/ || true)
          if [[ "$code" != "200" ]]; then
            echo "FAIL: / answered $code, expected 200" >&2
            exit 1
          fi
          echo "deploy OK"
          REMOTE
