# CI/CD (master doc 8.6, §14 phase 7).
#
# Tests and images are filtered per service so that touching `app/` never
# rebuilds the API image -- the monorepo boundary of docs/REPO_DECISION.md,
# expressed as `paths:` (8.6).
#
# Jobs
#   test-contract   spectral lint of both OpenAPI documents (10 s, always)
#   test-api        testthat inside the dev image, with a real Postgres and
#                   Redis service container
#   test-shiny      the UI unit suite plus Cypress against the real API
#   test-share      the public share service suite
#   test-integration  the three descriptions of the system against each other
#   build-*         multi-arch image to GHCR (latest + :sha)
#   deploy          SSH to the VM: fetch+verify assets, pull, up, smoke test
#
# The four test jobs do NOT run on the runner's Nix. They pull
# ghcr.io/angelfelizr/nyc-taxi-dev:latest and run inside it, because that image
# is the same environment `./setup.sh` gives you locally: Ubuntu, Determinate
# Nix, and every nix/r-*.nix layer already built into the store. Running bare
# on the runner would let CI and a laptop disagree about the filesystem, the
# Nix version and the store -- the class of difference that costs a day to
# find.
#
# The image is BUILT LOCALLY AND PUSHED BY HAND, because nix/ changes far less
# often than the code and CI should never pay for an environment rebuild. The
# procedure is in AGENTS.md under "Contenedor de desarrollo".
#
# Assumptions worth knowing before the first run:
#   - Builds run on ubuntu-24.04-arm (free for public repos) because the VM is
#     ARM: building under QEMU makes a Nix closure unbearably slow.
#   - Tests run on ubuntu-latest (x86_64) inside the dev image with
#     `--network host`, which is how they reach the service containers on
#     localhost. Nothing there is architecture sensitive, and the
#     rstats-on-nix binary cache has both.
#   - The API suite passes with no models and no dataset mounted, so test-api
#     never downloads the release. test-shiny does: the browser suite talks to
#     the real API, which needs the dataset to play a day and the reference
#     distribution for /finish to answer. The download is cached and verified
#     by infra/scripts/fetch-assets.sh (section 4.5).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Test-only values: .env is gitignored and absent from the checkout, so
  # whatever the jobs export is what the suites read.
  API_INTERNAL_KEY: ci-internal-key-not-a-secret
  IP_HASH_SALT: ci-ip-hash-salt
  POSTGRES_HOST: localhost
  REDIS_HOST: localhost

jobs:
  # ---------------------------------------------------------------------
  # Which services changed? Everything else keys off these outputs.
  # ---------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      share: ${{ steps.filter.outputs.share }}
      nix: ${{ steps.filter.outputs.nix }}
      integration: ${{ steps.filter.outputs.integration }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contract:
              - 'contract/**'
            api:
              - 'api/**'
            app:
              - 'app/**'
              - 'shared/**'
            share:
              - 'share/**'
              - 'shared/**'
            # A pin or a package-set change rebuilds every shell, so every
            # suite has to re-run.
            nix:
              - 'nix/**'
              - 'default.nix'
            # Anything that goes into an image.
            images:
              - 'api/**'
              - 'app/**'
              - 'share/**'
              - 'shared/**'
              - 'nix/**'
              - 'Dockerfile'
              - '.dockerignore'
            # The integration suite reads the CODE of the three services and
            # .env.example and compares them against the contract and against
            # each other, so a change on either side has to re-run it.
            # Filtering it on integration/** alone let an undocumented env
            # knob (SETUP_TIMEOUT_S, added to api/) ship under a green CI:
            # the job that would have caught it never started.
            integration:
              - 'integration/**'
              - 'contract/**'
              - '.env.example'
              - 'api/**'
              - 'app/**'
              - 'share/**'
              - 'shared/**'
              - 'tools/**'

  # ---------------------------------------------------------------------
  # test-contract: cheap and the contract is what every service reads, so it
  # runs on every change rather than being filtered away.
  # ---------------------------------------------------------------------
  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: spectral lint (0 errors is the bar)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo stoplight/spectral lint \
            contract/openapi.yaml contract/share.openapi.yaml \
            --ruleset contract/.spectral.yaml

  # ---------------------------------------------------------------------
  # test-api: real Postgres and real Redis, exactly like the dev container.
  # Postgres comes from a service container, not testcontainers (ADR 0001).
  # ---------------------------------------------------------------------
  test-api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.nix == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nyctaxi
          POSTGRES_PASSWORD: nyctaxi
          POSTGRES_DB: nyctaxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyctaxi -d nyctaxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    # No .env exists in a fresh checkout (it is gitignored), so the values the
    # compose gives the containers have to be given here instead. Without them
    # the suite would connect to a host called "postgres" and every endpoint
    # would 403 on an empty API_INTERNAL_KEY.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nyctaxi
      POSTGRES_USER: nyctaxi
      POSTGRES_PASSWORD: nyctaxi
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      API_INTERNAL_KEY: ci-internal-key
      IP_HASH_SALT: ci-ip-hash-salt
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The environment is built where it changes -- locally -- and pushed by
      # hand, because nix/ moves far less often than the code does. CI only
      # pulls it, and then refuses to test against one built from different
      # pins: ./infra/scripts/dev-image.sh check compares the image's nix-hash
      # label with this checkout. Procedure in AGENTS.md.
      - name: pull the development image
        run: |
          docker pull "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest"
          ./infra/scripts/dev-image.sh check
      - name: API tests (inside the dev image)
        run: |
          set -o pipefail
          docker run --rm --network host --shm-size=2g \
            -v "$PWD:/root/NycTaxiApp" \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e REDIS_HOST -e REDIS_PORT -e API_INTERNAL_KEY -e IP_HASH_SALT \
            "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest" \
            bash -c 'cd /root/NycTaxiApp/api && nix-shell default.dev.nix --run "Rscript tests/testthat.R"' 2>&1 \
            | tee "$RUNNER_TEMP/api.log"
      - name: annotate failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/api.log" "API"
      # Section 10, both bars: 60% globally and 100% on the seven critical
      # files. Same image as the tests, so the number is measured in the
      # environment the assertions ran in. The report is written straight into
      # the step summary, which is why $RUNNER_TEMP is mounted at the same
      # path inside the container.
      - name: coverage (section 10)
        run: |
          set -o pipefail
          docker run --rm --network host --shm-size=2g \
            -v "$PWD:/root/NycTaxiApp" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_DB -e POSTGRES_USER \
            -e POSTGRES_PASSWORD -e REDIS_HOST -e REDIS_PORT \
            -e API_INTERNAL_KEY -e IP_HASH_SALT \
            -e COVERAGE_FAIL_UNDER=60 -e COVERAGE_FAIL_CRITICAL=1 \
            -e GITHUB_STEP_SUMMARY \
            "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest" \
            bash -c 'cd /root/NycTaxiApp/api && nix-shell default.dev.nix --run "Rscript dev/coverage.R"' 2>&1 \
            | tee "$RUNNER_TEMP/coverage.log"
      - name: annotate coverage failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/coverage.log" "coverage"

  # ---------------------------------------------------------------------
  # test-shiny: the unit suite, then Cypress against the real stack. The
  # browser suite is an integration test now (ADR-0012), so the job carries
  # what the dev container carries: Postgres and Redis as in test-api, the
  # mail catcher for the email prompt, and the models + dataset from the
  # release. app/dev/e2e.sh starts the API, share/ and the client-IP proxy
  # inside the container, so the recipe is the same one used locally.
  # ---------------------------------------------------------------------
  test-shiny:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' || needs.changes.outputs.nix == 'true'
      || needs.changes.outputs.api == 'true' || needs.changes.outputs.share == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nyctaxi
          POSTGRES_PASSWORD: nyctaxi
          POSTGRES_DB: nyctaxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyctaxi -d nyctaxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      # POST /share-email pulls the card from share/ and answers 503 without a
      # relay (5.6), which is what the email prompt in Results exercises.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nyctaxi
      POSTGRES_USER: nyctaxi
      POSTGRES_PASSWORD: nyctaxi
      REDIS_PORT: "6379"
      MODELS_DIR: /models
      DATA_DIR: /data
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The environment is built where it changes -- locally -- and pushed by
      # hand, because nix/ moves far less often than the code does. CI only
      # pulls it, and then refuses to test against one built from different
      # pins: ./infra/scripts/dev-image.sh check compares the image's nix-hash
      # label with this checkout. Procedure in AGENTS.md.
      - name: pull the development image
        run: |
          docker pull "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest"
          ./infra/scripts/dev-image.sh check
      # 562 MB of release assets, restored from the cache when the key hits and
      # downloaded once when it does not. fetch-assets.sh verifies the
      # checksums (4.5) and aborts loudly if the release does not publish
      # SHA256SUMS -- which is deliberate: a browser suite run against
      # unverified models is not a result worth having.
      - name: restore the model and dataset cache
        uses: actions/cache@v4
        with:
          path: |
            ~/nyctaxi/models
            ~/nyctaxi/data
          key: nyctaxi-data-v0.0.1-data
      - name: fetch the release assets (verified)
        run: |
          MODELS_DIR="$HOME/nyctaxi/models" DATA_DIR="$HOME/nyctaxi/data" \
            ./infra/scripts/fetch-assets.sh v0.0.1-data
      - name: UI unit tests (inside the dev image)
        run: |
          set -o pipefail
          docker run --rm --network host --shm-size=2g \
            -v "$PWD:/root/NycTaxiApp" \
            -v "$HOME/nyctaxi/models:/models:ro" -v "$HOME/nyctaxi/data:/data:ro" \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e REDIS_HOST -e REDIS_PORT -e API_INTERNAL_KEY -e IP_HASH_SALT \
            -e MODELS_DIR -e DATA_DIR \
            "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest" \
            bash -c 'cd /root/NycTaxiApp/app && nix-shell default.dev.nix --run "Rscript tests/testthat.R"' 2>&1 \
            | tee "$RUNNER_TEMP/app.log"
      - name: annotate unit test failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/app.log" "UI"
      - name: browser suite (Cypress against the real API)
        run: |
          set -o pipefail
          docker run --rm --network host --shm-size=2g \
            -v "$PWD:/root/NycTaxiApp" \
            -v "$HOME/nyctaxi/models:/models:ro" -v "$HOME/nyctaxi/data:/data:ro" \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e REDIS_HOST -e REDIS_PORT -e API_INTERNAL_KEY -e IP_HASH_SALT \
            -e MODELS_DIR -e DATA_DIR \
            "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest" \
            bash -c 'cd /root/NycTaxiApp/app && nix-shell default.dev.nix --run "./dev/e2e.sh"' 2>&1 \
            | tee "$RUNNER_TEMP/e2e.log"
      - name: annotate browser failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/e2e.log" "E2E"

  # ---------------------------------------------------------------------
  # test-share: needs Redis (the cache and routes tests skip without it) but
  # never the API -- test-routes.R boots its own stub.
  # ---------------------------------------------------------------------
  test-share:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.share == 'true' || needs.changes.outputs.nix == 'true'
    # Same reason as test-api: no .env in a fresh checkout. test-routes.R
    # sends this key to POST /render-card and the stub the test boots reads it
    # from its own environment, so the value has to exist here.
    env:
      API_INTERNAL_KEY: ci-internal-key
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The environment is built where it changes -- locally -- and pushed by
      # hand, because nix/ moves far less often than the code does. CI only
      # pulls it, and then refuses to test against one built from different
      # pins: ./infra/scripts/dev-image.sh check compares the image's nix-hash
      # label with this checkout. Procedure in AGENTS.md.
      - name: pull the development image
        run: |
          docker pull "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest"
          ./infra/scripts/dev-image.sh check
      - name: share tests (inside the dev image)
        run: |
          set -o pipefail
          docker run --rm --network host --shm-size=2g \
            -v "$PWD:/root/NycTaxiApp" \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e REDIS_HOST -e REDIS_PORT -e API_INTERNAL_KEY -e IP_HASH_SALT \
            "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest" \
            bash -c 'cd /root/NycTaxiApp/share && nix-shell default.dev.nix --run "Rscript tests/testthat.R"' 2>&1 \
            | tee "$RUNNER_TEMP/share.log"
      - name: annotate failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/share.log" "share"

  # ---------------------------------------------------------------------
  # test-integration: the three descriptions of the system against each
  # other (contract <-> registered routes <-> client paths). No services: it
  # only reads files, which is why it needs no Postgres or Redis and only
  # integration/default.dev.nix (testthat + yaml) instead of the root shell.
  # ---------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The environment is built where it changes -- locally -- and pushed by
      # hand, because nix/ moves far less often than the code does. CI only
      # pulls it, and then refuses to test against one built from different
      # pins: ./infra/scripts/dev-image.sh check compares the image's nix-hash
      # label with this checkout. Procedure in AGENTS.md.
      - name: pull the development image
        run: |
          docker pull "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest"
          ./infra/scripts/dev-image.sh check
      - name: integration tests (inside the dev image)
        run: |
          set -o pipefail
          docker run --rm --network host --shm-size=2g \
            -v "$PWD:/root/NycTaxiApp" \
            -e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e REDIS_HOST -e REDIS_PORT -e API_INTERNAL_KEY -e IP_HASH_SALT \
            "${REGISTRY}/angelfelizr/nyc-taxi-dev:latest" \
            bash -c 'cd /root/NycTaxiApp/integration && nix-shell default.dev.nix --run "Rscript tests/testthat.R"' 2>&1 \
            | tee "$RUNNER_TEMP/integration.log"
      - name: annotate failures
        if: failure()
        run: ./infra/scripts/ci_report.sh "$RUNNER_TEMP/integration.log" "integration"
  # ---------------------------------------------------------------------
  # Images. Native ARM: the deployment VM is ARM and a Nix closure under QEMU
  # does not fit in a job.
  # ---------------------------------------------------------------------
  build-api:
    runs-on: ubuntu-24.04-arm
    needs: [changes, test-api]
    if: >-
      needs.changes.outputs.images == 'true' && !cancelled() &&
      needs.test-api.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-api:latest
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-shiny:
    runs-on: ubuntu-24.04-arm
    needs: [changes, test-shiny]
    if: >-
      needs.changes.outputs.images == 'true' && !cancelled() &&
      needs.test-shiny.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-shiny:latest
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-shiny:${{ github.sha }}
          cache-from: type=gha,scope=shiny
          cache-to: type=gha,scope=shiny,mode=max

  build-share:
    runs-on: ubuntu-24.04-arm
    needs: [changes, test-share]
    if: >-
      needs.changes.outputs.images == 'true' && !cancelled() &&
      needs.test-share.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: share/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-share:latest
            ${{ env.REGISTRY }}/angelfelizr/nyc-taxi-share:${{ github.sha }}
          cache-from: type=gha,scope=share
          cache-to: type=gha,scope=share,mode=max

  # ---------------------------------------------------------------------
  # Deploy (main only). Downtime of ~30s is accepted (8.6).
  #
  # Secrets the repository needs: VM_HOST, VM_USER, VM_SSH_KEY.
  # The VM is expected to hold the repository at ~/NycTaxiApp with .env,
  # /srv/nyctaxi/{models,data} and /backups already provisioned.
  # ---------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, build-api, build-shiny, build-share]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy and smoke test
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          # The scripts travel with the checkout, not with the images.
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/NycTaxiApp
          git pull --ff-only

          # 4.5: download and verify the release assets. fetch-assets.sh is
          # idempotent -- already-present and correct files cost one HTTP
          # request (the manifest) -- and aborts before anything restarts if
          # a checksum cannot be verified.
          MODELS_DIR=/srv/nyctaxi/models DATA_DIR=/srv/nyctaxi/data \
            ./infra/scripts/fetch-assets.sh

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "waiting for the stack to settle..."
          sleep 20

          # Smoke test of EXPOSURE (8.6): the API must not be reachable
          # through the edge, and only nginx may publish a port.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   --max-time 15 https://nyctaxiapp.angelfeliz.com/api/health || true)
          if [[ "$code" != "404" ]]; then
            echo "FAIL: /api/health answered $code, expected 404" >&2
            exit 1
          fi

          published=$(docker ps --format '{{.Ports}}' | tr ' ' '\n' | grep -oE '^[0-9]+:' | sort -u | tr -d ':')
          unexpected=$(comm -23 <(echo "$published") <(printf '443\n80\n') || true)
          if [[ -n "${unexpected// }" ]]; then
            echo "FAIL: unexpected published ports: $unexpected" >&2
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                   https://nyctaxiapp.angelfeliz.com/ || true)
