# Smoke-test overlay for docker-compose.prod.yml -- NOT a deployment file.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.smoke.yml \
#     up -d
#
# Two things only, both so a workstation can run the production stack without
# touching anything outside the repository:
#
#   1. /models and /data are re-pointed at the directories .env already has
#      (the production file mounts /srv/nyctaxi/..., which exists on the VM and
#      is documented in docs/operations/first-deploy.md).
#   2. /etc/letsencrypt is replaced by self-signed certificates generated by
#      infra/scripts/smoke-stack.sh -- otherwise Docker would create an empty
#      /etc/letsencrypt on the host and nginx would fail to start.
#
# Compose merges volume entries by their target, so these replace the two the
# production file declares and change nothing else.

services:
  api:
    volumes:
      - ${MODELS_DIR:?Set MODELS_DIR in .env}:/models:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}:/data:ro

  nginx:
    volumes:
      - ${SMOKE_CERTS:-/tmp/nyctaxi-certs}:/etc/letsencrypt:ro
