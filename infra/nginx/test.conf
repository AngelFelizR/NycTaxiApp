# The edge of the LOCAL TEST STACK (docker-compose.test.yml) -- NOT production.
#
#   docker compose -f docker-compose.test.yml up -d
#   open http://127.0.0.1:3838
#
# It exists for two reasons, and neither is cosmetic.
#
# 1. X-Client-IP. The API rate-limits at 3 experiments per IP per day, keyed by
#    sha256(IP_HASH_SALT || ip), and there is no knob to turn it off (looked for:
#    no RATE_* variable exists in api/R). Without this proxy every request that
#    reaches the API carries the Docker bridge address, so the third experiment
#    of the day gets a 429 and the stack is unusable. In production the header
#    arrives from Cloudflare as $http_cf_connecting_ip (nginx.conf:114); here
#    there is no Cloudflare, so it is $remote_addr. This is the same fix as
#    app/dev/e2e-proxy.js, in nginx rather than Node so the stack needs no
#    extra runtime.
#
# 2. One URL. Nginx routes / to the Shiny app and /share/* + /waitlist to the
#    share service, exactly like production, so SHARE_BASE_URL is the page the
#    browser is actually on -- the same-origin shape the deployed stack has.
#
# proxy_read_timeout on the app location is load-bearing: nginx would otherwise
# cut an idle WebSocket at 60 s and every Shiny session would die mid-day. The
# production conf sets 3600s for the same reason (nginx.conf:173).

# Shiny is a WebSocket app. `Connection` cannot be set to the literal "upgrade"
# for every request, so it is mapped: upgrade only when the client asked.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Long POST bodies are not a thing here (the API talks JSON), but the
    # default 1 m is low enough to surprise someone pasting a big seed.
    client_max_body_size 2m;

    # The app. `app` is the compose service name of the Shiny container.
    location / {
        include snippets/security-headers.conf;

        proxy_pass http://app:3838;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        # The reason this file exists. See the header.
        proxy_set_header X-Client-IP       $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Longest-prefix match wins over `location /`, so no ordering trick is
    # needed the way the production conf needs one for its regex locations.
    location /share/ {
        include snippets/security-headers.conf;

        proxy_pass http://share:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Client-IP       $remote_addr;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location = /waitlist {
        include snippets/security-headers.conf;

        proxy_pass http://share:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Client-IP       $remote_addr;
        proxy_read_timeout 15s;
    }
}
