# Nginx edge (master doc 8.2).
#
# Routes ONLY to ShinyProxy and to the share service. The API has no route
# here and no published port: /api/ is a deliberate 404, which is also what
# the phase-7 deploy smoke test asserts.
#
#   docker compose -f docker-compose.prod.yml exec nginx nginx -t

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time '
                    'cf="$http_cf_connecting_ip" ua="$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # 8.2: the waitlist and the share page are the only bodies we accept.
    client_max_body_size 1M;

    # 8.2: gzip the share HTML (the PNG is already compressed). text/html is
    # always compressed and must not be listed -- nginx warns about it.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 8.2: trust the client address Cloudflare saw, and only from Cloudflare.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # 8.2: 10 r/s per IP for /share/ and /waitlist. Nginx answers 429 rather
    # than queueing, so a crawler cannot pin a worker.
    limit_req_zone $binary_remote_addr zone=share_limit:10m rate=10r/s;
    limit_req_status 429;

    # Shiny speaks WebSocket; without this the session falls back to SockJS
    # and reconnects constantly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream shinyproxy {
        server shinyproxy:8080;
        keepalive 32;
    }

    upstream share_upstream {
        server share:8001;
        keepalive 8;
    }

    # ---------------------------------------------------------------- http
    server {
        listen 80;
        server_name nyctaxiapp.angelfeliz.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # security.txt and anything else served from the static document root.
        # Without this, /.well-known/* falls through to `location /` and gets
        # proxied to ShinyProxy, which has never heard of it.
        location /.well-known/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------- https
    server {
        listen 443 ssl;
        http2 on;
        server_name nyctaxiapp.angelfeliz.com;

        ssl_certificate     /etc/letsencrypt/live/nyctaxiapp.angelfeliz.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nyctaxiapp.angelfeliz.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;

        # Baseline headers live in a snippet: nginx does not inherit
        # `add_header` into a location that defines its own, so every location
        # needing a header includes this file itself.
        include /etc/nginx/snippets/security-headers.conf;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 8.2 / 5.4: the address the API's per-IP limits are keyed on. Nginx
        # fills it from CF-Connecting-IP after real_ip rewrote $remote_addr.
        proxy_set_header X-Client-IP       $http_cf_connecting_ip;

        # 8.2: an upstream 503 (ShinyProxy out of seats, share or api down)
        # shows the demo + waitlist page instead of an error.
        proxy_intercept_errors on;
        error_page 503 /capacity-full.html;

        # The error page must be served here, not proxied back to ShinyProxy.
        location = /capacity-full.html {
            internal;
            root /usr/share/nginx/html;
            include /etc/nginx/snippets/security-headers.conf;
            # This page runs one inline script (the waitlist fetch of 8.2) and
            # posts to the same origin; everything else is locked down.
            add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; connect-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        }

        # The API is private: nothing reaches it through this proxy (1.0, 9.3).
        # security.txt lives behind the same document root as the capacity
        # page. It must be in THIS server block: the one above only listens on
        # 80 and everything here arrives on 443.
        location /.well-known/ {
            root /usr/share/nginx/html;
        }

        # The API is private: nothing reaches it through this proxy (1.0, 9.3).
        location /api/ {
            return 404;
        }

        # Public share service: HTML for humans, PNG for crawlers (5.10).
        location /share/ {
            limit_req zone=share_limit burst=20 nodelay;
            proxy_pass http://share_upstream;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
            include /etc/nginx/snippets/security-headers.conf;
            # 7.2: the share page is markup and a stylesheet, never a script.
            # script-src 'none' turns that from a promise into a guarantee.
            # It does NOT apply to /, which runs Shiny and would need its own
            # policy -- deferred, see ADR-004.
            add_header Content-Security-Policy "default-src 'none'; script-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        }

        location = /waitlist {
            limit_req zone=share_limit burst=10 nodelay;
            proxy_pass http://share_upstream;
            proxy_read_timeout 15s;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Everything else is the Shiny app behind ShinyProxy.
        location / {
            proxy_pass http://shinyproxy;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # A session can idle between decisions; the default 60s would
            # drop the WebSocket and force a reconnect.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
