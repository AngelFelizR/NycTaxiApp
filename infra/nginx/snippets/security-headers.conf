# Baseline response headers for every location. They live in a snippet, not
# only in the `server` block, because nginx does not inherit `add_header` into
# a location that defines its own -- each location that needs a header has to
# include this file.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
